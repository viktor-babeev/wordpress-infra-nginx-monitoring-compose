apiVersion: 1

providers:
  - name: 'Production Infrastructure' # Название папки в веб-интерфейсе Grafana
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10 # Проверять изменения в файлах каждые 10 секунд
    options:
      path: /etc/grafana/provisioning/dashboards/storage # Путь внутри контейнера
      # Указание источника данных (datasource)
      jsonData:
        DS_PROMETHEUS: Prometheus # name из файла datasource.yaml
